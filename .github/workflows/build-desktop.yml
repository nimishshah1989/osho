name: Build desktop app

# Builds the Osho Archives desktop installers (.dmg for macOS, .exe
# for Windows) on GitHub's native runners — desktop installers can
# only be built on their target OS.
#
# Manual trigger only. After a run finishes, download the installers
# from the run's "Artifacts" section.

on:
  workflow_dispatch:

jobs:
  # Gate: prove the offline archive actually opens before we spend time
  # building installers. This builds the real static export and drives it
  # through the real desktop server in headless Chromium (Electron's
  # renderer IS Chromium) — installing + opening the corpus via the OPFS
  # SAHPool VFS and running a real query. If the archive can't be opened
  # (the app would show "Couldn't set up the archive"), the whole workflow
  # fails and no installers are produced.
  verify-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build the static frontend (same as the installer build)
        working-directory: frontend
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          rm -rf app/api app/ask
          DESKTOP_BUILD=true npx next build
      - name: Install desktop deps + Chromium
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Check all runtime-required modules are packaged
        working-directory: desktop
        run: npm run check:bundle
      - name: Verify the offline archive opens end-to-end
        working-directory: desktop
        run: npm run verify:offline

  build:
    needs: verify-offline
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Build the frontend as a static export. `shell: bash` so the
      # rm / env-var syntax works on the Windows runner too.
      #
      # `--ignore-scripts`: the frontend has `better-sqlite3` as a *test*
      # devDependency, whose install script compiles a native module via
      # node-gyp — which fails on the Windows runner. The static export
      # never uses better-sqlite3, so skipping all install scripts is
      # both safe and what unblocks the Windows build.
      - name: Build frontend (static export)
        shell: bash
        working-directory: frontend
        run: |
          npm install --ignore-scripts
          rm -rf app/api app/ask
          DESKTOP_BUILD=true npx next build

      # Stage the static frontend inside the desktop project so
      # electron-builder bundles it.
      - name: Stage frontend into desktop app
        shell: bash
        run: |
          rm -rf desktop/app
          cp -r frontend/out desktop/app

      # Bundle the offline corpus inside the installer. Pulled from the
      # stable `corpus-latest` GitHub release (server-side download — no
      # CORS in play). The app's local server serves it at /corpus/...
      - name: Bundle the offline corpus
        shell: bash
        run: |
          mkdir -p desktop/app/corpus
          curl -fL --retry 3 --retry-delay 5 \
            -o desktop/app/corpus/osho.db.zst \
            "https://github.com/nimishshah1989/osho/releases/download/corpus-latest/osho.db.zst"
          # Also bundle the checksum. The app serves it at
          # /corpus/osho.db.zst.sha256 and OfflineProvider compares it to the
          # corpus already in OPFS — when a newer app ships a different corpus
          # the checksum changes, so the app re-installs the fresh data instead
          # of clinging to the stale copy forever (Anuragi 2026-07-08: the
          # offline Hindi stayed pre-Unicode because nothing refreshed it).
          curl -fL --retry 3 --retry-delay 5 \
            -o desktop/app/corpus/osho.db.zst.sha256 \
            "https://github.com/nimishshah1989/osho/releases/download/corpus-latest/osho.db.zst.sha256"
          ls -lh desktop/app/corpus/osho.db.zst desktop/app/corpus/osho.db.zst.sha256

      - name: Build installer
        shell: bash
        working-directory: desktop
        run: |
          npm install
          npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: osho-archives-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.exe
          if-no-files-found: error

  # Publish the installers as assets on a stable GitHub Release. End users
  # then download them over GitHub's fast release CDN (Fastly) instead of
  # the slow, non-CDN Actions "Artifacts" blob storage — the latter can
  # crawl for hours, especially from outside the US. The offline corpus is
  # already distributed this way (corpus-latest); this gives the desktop
  # installers the same fast, stable download URLs:
  #   https://github.com/<owner>/<repo>/releases/download/desktop-latest/<file>
  publish-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download both installers built in this run
        uses: actions/download-artifact@v4
        with:
          path: installers

      - name: Publish installers to the desktop-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          echo "Installers built in this run:"
          find installers -type f \( -name '*.dmg' -o -name '*.exe' \) -print

          # Create the rolling release once (ignore the error when it
          # already exists), then overwrite its assets below.
          gh release create desktop-latest \
            --title "Osho Archives — Desktop app (latest)" \
            --notes "Latest macOS (.dmg) and Windows (.exe) installers. Offline-first: the full discourse archive is bundled, so no internet is needed after install." \
            || true

          # -print0 / read -d '' so filenames with spaces (electron-builder
          # names them "Osho Archives ...") upload correctly. --clobber
          # overwrites the previous copy so the URLs stay stable.
          find installers -type f \( -name '*.dmg' -o -name '*.exe' \) -print0 \
            | while IFS= read -r -d '' f; do
                echo "Uploading: $f"
                gh release upload desktop-latest "$f" --clobber
              done

          echo "Assets: https://github.com/${GH_REPO}/releases/tag/desktop-latest"
