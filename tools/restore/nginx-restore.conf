# Private photo-restoration tool. Add inside the oshoarchives.com server block.
# Delete this block and reload nginx to remove the tool from the public site.
location /restore/ {
    proxy_pass http://127.0.0.1:8010/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;      # cleaning a large scan takes minutes
    proxy_send_timeout 3600s;
    client_max_body_size 400M;     # a 16-bit TIFF is 60-90 MB
}
