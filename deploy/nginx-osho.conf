# Osho Archives — nginx site config.
#
# Deployed to /etc/nginx/sites-available/osho on the E2E VPS (164.52.223.241).
# This file is the source of truth; the copy on the box is downstream of it.
#
# NOT deployed by any GitHub Action — applying it needs root, which the `osho`
# deploy user does not have without a password. To apply, as someone with root:
#
#   scp -i ~/.ssh/osho_e2e deploy/nginx-osho.conf osho@164.52.223.241:/tmp/osho.conf
#   ssh -i ~/.ssh/osho_e2e osho@164.52.223.241
#   sudo install -m 644 -o root -g root /tmp/osho.conf /etc/nginx/sites-available/osho
#   sudo nginx -t && sudo systemctl reload nginx
#
# Until it is applied the box still runs the old config, whose 10M cap is what
# blocked the 2026-08-01 corpus update.

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name oshoarchives.com www.oshoarchives.com api.oshoarchives.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name oshoarchives.com www.oshoarchives.com;

    ssl_certificate     /etc/letsencrypt/live/oshoarchives.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oshoarchives.com/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    client_max_body_size 10M;

    include /etc/nginx/snippets/cloudflare-allow.conf;

    # Admin corpus uploads need far more headroom than the rest of the site: a
    # monthly .docx batch runs to tens of MB and the ingest is synchronous
    # inside the request. The site-wide 10M above is what 413'd Anuragi's
    # 2026-08-01 update — and because nginx answers with an HTML error page,
    # the admin UI reported it as "Network error — could not reach the server".
    #
    # 100M is the ceiling Cloudflare's free plan will forward (verified: a
    # 110 MB POST is rejected by Cloudflare itself, before it reaches us), so a
    # larger value here would only move the 413 out to the edge. Scoped to this
    # location so the public site keeps the small, abuse-resistant 10M limit.
    location /api/admin/ {
        proxy_pass http://127.0.0.1:3000;
        client_max_body_size 100M;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / { proxy_pass http://127.0.0.1:3000; }
    access_log /var/log/nginx/osho-frontend.access.log;
    error_log  /var/log/nginx/osho-frontend.error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.oshoarchives.com;

    ssl_certificate     /etc/letsencrypt/live/oshoarchives.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oshoarchives.com/privkey.pem;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    client_max_body_size 20M;

    include /etc/nginx/snippets/cloudflare-allow.conf;

    # Same headroom for anyone hitting the ingest endpoints directly (curl,
    # scripts) rather than through the Next.js proxy.
    location /admin/ {
        proxy_pass http://127.0.0.1:8000;
        client_max_body_size 100M;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location / { proxy_pass http://127.0.0.1:8000; }
    access_log /var/log/nginx/osho-backend.access.log;
    error_log  /var/log/nginx/osho-backend.error.log;
}
